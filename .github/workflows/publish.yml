name: Publish products

on:
  workflow_dispatch:
    inputs:
      store_slug:
        description: "Store to publish (defaults to the one src/data/store.json was generated for)"
        required: false
        type: string
      allow_catalogue_shrink:
        description: "Allow a publish that removes most of the catalogue"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/generate-site-data.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORE_SLUG: ${{ inputs.store_slug }}
          ALLOW_CATALOGUE_SHRINK: ${{ inputs.allow_catalogue_shrink && '1' || '' }}

      # The generated data is what the site is built from, so a publish that
      # cannot build must not be committed.
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Commit updated products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json src/data/categories.json src/data/store.json
          git diff --cached --quiet && echo "No product changes to publish." || git commit -m "chore: publish products from admin panel"
          git push origin HEAD:${{ github.ref_name }}
